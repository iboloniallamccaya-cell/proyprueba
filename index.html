<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio 11 - Login Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-container">
    <h1>Iniciar sesión</h1>
    <p class="help-text">Ingresa tus credenciales de demostración para continuar. Usa el correo y contraseña de prueba que te dieron.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="demo@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginBtn">Ingresar</button>
    </form>

    <div id="message" class="message" role="alert" aria-live="polite"></div>
  </main>

  <footer class="student-footer">
    <p>Ignacio Bolonia Llamccaya — 2026018895@unfv.edu.pe</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
